<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RaionShop Web App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 920px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .card { border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    button { cursor: pointer; }
    input, select, button { padding: 8px; }
    pre { background:#f7f7f7; padding:10px; border-radius:8px; overflow:auto; }
  </style>
</head>
<body>
  <h1>RaionShop — Telegram Web App</h1>

  <div class="card">
    <h3>Пользователь</h3>
    <div class="row">
      <input id="userId" type="number" placeholder="User ID" value="1" />
      <button onclick="loadProfile()">Загрузить профиль</button>
      <button onclick="topup()">Пополнить +100 Stars</button>
    </div>
    <pre id="profile"></pre>
  </div>

  <div class="card">
    <h3>Каталог / Покупка</h3>
    <div class="row">
      <select id="product"></select>
      <select id="payment">
        <option>Pally</option>
        <option>Platega</option>
        <option>CryptoBot</option>
        <option>FreeKassa</option>
      </select>
      <input id="qty" type="number" min="1" value="1" />
      <button onclick="buy()">Купить</button>
    </div>
    <pre id="buyResult"></pre>
  </div>

  <div class="card">
    <h3>Чеки Stars</h3>
    <div class="row">
      <input id="checkAmount" type="number" min="1" value="50" />
      <button onclick="createCheck()">Создать чек</button>
    </div>
    <div class="row">
      <input id="checkCode" placeholder="Код чека" />
      <button onclick="activateCheck()">Активировать чек</button>
    </div>
    <pre id="checkResult"></pre>
  </div>

  <script>
    async function j(url, options = {}) {
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Request failed');
      return data;
    }

    async function loadCatalog() {
      const data = await j('/api/catalog');
      const sel = document.getElementById('product');
      sel.innerHTML = '';
      for (const p of data) {
        const o = document.createElement('option');
        o.value = p.product_key;
        o.textContent = `${p.name} (${p.price}⭐)`;
        sel.appendChild(o);
      }
    }

    async function loadProfile() {
      try {
        const userId = Number(document.getElementById('userId').value);
        const data = await j(`/api/user/${userId}`);
        document.getElementById('profile').textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        alert(e.message);
      }
    }

    async function topup() {
      try {
        const userId = Number(document.getElementById('userId').value);
        await j('/api/topup', {
          method: 'POST',
          body: JSON.stringify({ user_id: userId, amount: 100 })
        });
        await loadProfile();
      } catch (e) {
        alert(e.message);
      }
    }

    async function buy() {
      try {
        const userId = Number(document.getElementById('userId').value);
        const product_key = document.getElementById('product').value;
        const payment_system = document.getElementById('payment').value;
        const quantity = Number(document.getElementById('qty').value);
        const data = await j('/api/buy', {
          method: 'POST',
          body: JSON.stringify({ user_id: userId, product_key, quantity, payment_system })
        });
        document.getElementById('buyResult').textContent = JSON.stringify(data, null, 2);
        await loadProfile();
      } catch (e) {
        alert(e.message);
      }
    }

    async function createCheck() {
      try {
        const user_id = Number(document.getElementById('userId').value);
        const amount = Number(document.getElementById('checkAmount').value);
        const data = await j('/api/checks/create', {
          method: 'POST',
          body: JSON.stringify({ user_id, amount })
        });
        document.getElementById('checkResult').textContent = JSON.stringify(data, null, 2);
        document.getElementById('checkCode').value = data.code;
        await loadProfile();
      } catch (e) {
        alert(e.message);
      }
    }

    async function activateCheck() {
      try {
        const user_id = Number(document.getElementById('userId').value);
        const code = document.getElementById('checkCode').value;
        const data = await j('/api/checks/activate', {
          method: 'POST',
          body: JSON.stringify({ user_id, code })
        });
        document.getElementById('checkResult').textContent = JSON.stringify(data, null, 2);
        await loadProfile();
      } catch (e) {
        alert(e.message);
      }
    }

    loadCatalog();
    loadProfile();
  </script>
</body>
</html>
